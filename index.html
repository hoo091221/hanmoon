<!DOCTYPE html>
<html lang="ko">

<!-- head -->

<head>
    <!-- Google Fonts -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet"> -->
    <!-- title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사자성어공부</title>
    <link href="./style.css" rel="stylesheet">
    <script src="./script.js" type="text/javascript"></script>

    <style>
        /* 전체 페이지 기본 스타일 */
        
        body {
            background-color: #f4f6f9;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: #333333;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* 중심 콘텐츠 영역 디자인 (카드 형태) */
        
        center {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            margin-bottom: 1.5rem;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        /* 사자성어 타이틀 */
        
        #randomWords {
            font-size: 2.8rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 1rem 0;
            word-break: keep-all;
        }
        /* 뜻 설명 텍스트 */
        
        #wordMeanings {
            font-size: 1.25rem;
            font-weight: 400;
            color: #555555;
            margin: 0;
            line-height: 1.5;
            word-break: keep-all;
        }
        /* 버튼 스타일 */
        
        .btn {
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            margin: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }
        
        .btn:hover {
            background-color: #4338ca;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        /* 체크박스 및 라벨 영역 */
        
        input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 0.5rem;
            cursor: pointer;
            accent-color: #4f46e5;
        }
        
        label {
            font-size: 1.1rem !important;
            /* HTML의 4vw 고정 스타일 오버라이드 및 가독성 개선 */
            font-weight: 500;
            cursor: pointer;
            vertical-align: middle;
        }
        /* 카운팅 및 리스트 영역 */
        
        #numbering {
            font-size: 1.1rem;
            color: #4b5563;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        #list {
            font-size: 0.95rem;
            color: #6b7280;
            background-color: #f9fafb;
            padding: 0.75rem;
            border-radius: 6px;
            margin: 0.5rem 0 0 0;
            word-break: break-all;
        }
        /* 체크박스 및 라벨 영역 */
        
        input[type="checkbox"] {
            width: 18px;
            /* 체크박스 너비 축소 */
            height: 18px;
            /* 체크박스 높이 축소 */
            margin-right: 0.5rem;
            cursor: pointer;
            accent-color: #4f46e5;
            /* 체크되었을 때의 색상 */
            vertical-align: middle;
        }
        
        label {
            font-size: 1rem !important;
            /* 글자 크기를 적당한 고정 크기로 변경 */
            font-weight: 500;
            cursor: pointer;
            vertical-align: middle;
        }
    </style>
</head>

<!-- body start -->

<body>
    <center>
        <h1 id="randomWords">
            여기에 단어가 표시됩니다!
        </h1>
        <h3 id="wordMeanings">여기에 뜻이 표시됩니다!</h3>
    </center>
    <center>
        <button onclick="mixWords();" class="btn">다음</button>
        <button onclick="wordMeanings();" class="btn">뜻 보기</button>
    </center>
    <center>

        <input type="checkbox" onclick="checkboxResponse();" id="checkbox" style="zoom: 3;"><label>중복 제거하기</label>
        <h3 id="numbering">현재까지 나온 단어 수: 0개</h5>
            <h4 id="list">(중복 제거 켜진 경우) 나온 단어 리스트</h4>

    </center>
</body>


</html>
